name: Links

on:
  push:
  pull_request:

jobs:
  check-links:
    name: Check internal markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check markdown links
        run: python scripts/check_links.py .
